name: Import source bundle
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack provided static site
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .source-bundle.b64 ]; then
            echo "No source bundle yet; nothing to import."
            exit 0
          fi
          base64 --decode .source-bundle.b64 | tar -xz
          rm .source-bundle.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No files changed."
          else
            git commit -m "feat: import the quiet hours website"
            git push origin HEAD:main
          fi
